[project]
name = "arus-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "pikepdf>=9.4,<11",
  "pdfplumber>=0.11,<1",
  "google-api-python-client>=2.149,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "reportlab>=4.2,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires an external provider"]
