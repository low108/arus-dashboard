services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./backend:/app"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0
    ports: ["3000:3000"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
